<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>NEAS | Employee Database</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      color: #1e293b;
    }

    .app-container {
      width: 100%;
      max-width: 1200px;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
      padding: 2rem 1.8rem;
      transition: all 0.2s;
    }

    /* LOGO + HEADER */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .logo-badge {
      background: #0f172a;
      color: white;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.2);
      letter-spacing: -1px;
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      background: linear-gradient(145deg, #0f172a, #334155);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-sub {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 500;
      margin-top: 2px;
    }

    .drive-badge {
      margin-left: auto;
      background: #eef2ff;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #1e40af;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #c7d2fe;
    }

    .drive-badge i {
      color: #4285F4;
    }

    .auth-section {
      background: #f8fafc;
      border-radius: 1.5rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.2rem;
      border: 1px solid #e2e8f0;
    }

    .role-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .role-btn {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 30px;
      padding: 0.5rem 1.2rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      color: #334155;
    }

    .role-btn.active {
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }

    .role-btn:hover {
      background: #e2e8f0;
    }

    .password-input {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .password-input input {
      padding: 0.6rem 1rem;
      border-radius: 30px;
      border: 1px solid #cbd5e1;
      font-size: 0.9rem;
      width: 160px;
      background: white;
    }

    .login-btn {
      background: #0f172a;
      color: white;
      border: none;
      padding: 0.7rem 1.6rem;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s;
    }

    .login-btn:hover {
      background: #1e293b;
    }

    .public-badge {
      background: #dcfce7;
      color: #166534;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .current-user {
      margin-left: auto;
      font-weight: 600;
      background: white;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      border: 1px solid #d1d5db;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewer-note {
      font-size: 0.85rem;
      color: #475569;
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* TOOLBAR */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1.8rem;
      align-items: center;
    }

    .btn {
      padding: 0.6rem 1.3rem;
      border-radius: 30px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
      background: white;
      border: 1px solid #cbd5e1;
      color: #1e293b;
    }

    .btn-primary {
      background: #0f172a;
      border-color: #0f172a;
      color: white;
    }

    .btn-primary:hover {
      background: #1e293b;
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 30px;
      padding: 0.2rem 0.2rem 0.2rem 1rem;
      flex: 1;
      min-width: 200px;
    }

    .search-box input {
      border: none;
      outline: none;
      padding: 0.5rem 0.2rem;
      font-size: 0.9rem;
      width: 100%;
      background: transparent;
    }

    .search-box i {
      color: #94a3b8;
    }

    /* TABLE */
    .table-container {
      overflow-x: auto;
      border-radius: 1.2rem;
      border: 1px solid #e2e8f0;
      background: white;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th {
      background: #f8fafc;
      text-align: left;
      padding: 1rem;
      font-weight: 600;
      font-size: 0.85rem;
      color: #475569;
      border-bottom: 1px solid #e2e8f0;
    }

    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .employee-avatar {
      width: 36px;
      height: 36px;
      background: #0f172a;
      color: white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.8rem;
      margin-right: 8px;
    }

    .drive-link {
      color: #1e40af;
      text-decoration: none;
      font-weight: 600;
      background: #eef2ff;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      transition: 0.15s;
    }

    .drive-link:hover {
      background: #dbeafe;
    }

    .action-icons {
      display: flex;
      gap: 0.7rem;
      align-items: center;
    }

    .action-icons i {
      cursor: pointer;
      font-size: 1rem;
      color: #64748b;
      transition: 0.1s;
    }

    .action-icons i:hover {
      color: #0f172a;
    }

    .editable-hint {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .footer-note {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #64748b;
    }

    .vercel-link {
      background: #f1f5f9;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }

    .modal-backdrop.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-card {
      background: white;
      border-radius: 1.5rem;
      padding: 2rem;
      width: 90%;
      max-width: 460px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .modal-card h3 {
      margin-bottom: 1.2rem;
    }

    .modal-card input {
      width: 100%;
      padding: 0.8rem;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      margin-bottom: 1rem;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- LOGO HEADER -->
  <div class="brand-header">
    <div class="logo-badge">NE</div>
    <div>
      <div class="logo-text">NextEdge Access Solutions</div>
      <div class="logo-sub">Employee Database · Secure Drive Sync</div>
    </div>
    <div class="drive-badge">
      <i class="fab fa-google-drive"></i> Drive Folder
    </div>
  </div>

  <!-- AUTH / LOGIN -->
  <div class="auth-section" id="authSection">
    <div class="role-buttons" id="roleSelector">
      <button class="role-btn active" data-role="admin">👑 Admin</button>
      <button class="role-btn" data-role="hr">🧑‍💼 HR</button>
      <button class="role-btn" data-role="manager">📋 Manager</button>
      <button class="role-btn" data-role="viewer">👁️ Viewer</button>
    </div>
    <div class="password-input" id="passwordWrapper">
      <input type="password" id="passwordInput" placeholder="Password" value="">
    </div>
    <button class="login-btn" id="loginButton"><i class="fas fa-key"></i> Login</button>
    <div class="public-badge" id="publicViewerBadge" style="display: none;"><i class="fas fa-globe"></i> Public Viewer</div>
    <div class="current-user" id="currentUserDisplay"><i class="fas fa-user-circle"></i> <span>public</span></div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar" id="toolbar">
    <button class="btn btn-primary" id="addEmployeeBtn"><i class="fas fa-plus"></i> Add Employee</button>
    <button class="btn btn-outline" id="exportCsvBtn"><i class="fas fa-file-export"></i> Export CSV</button>
    <label class="btn btn-outline" for="importCsvInput" style="cursor:pointer;"><i class="fas fa-file-import"></i> Import CSV</label>
    <input type="file" id="importCsvInput" accept=".csv" style="display:none">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search employees...">
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <table id="employeeTable">
      <thead>
        <tr>
          <th>Employee</th>
          <th>Role</th>
          <th>Email</th>
          <th>Drive Folder</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- dynamic rows -->
      </tbody>
    </table>
  </div>
  <div class="footer-note">
    <span><i class="fas fa-link"></i> Each employee folder connected to Drive: <strong>18LExKPiPAU4zvAEV5cg8v1ELeC1ncCHU</strong></span>
    <a href="https://vercel.com/nextedgeaccesssolutions-neas" target="_blank" class="vercel-link"><i class="fas fa-arrow-up-right-from-square"></i> Vercel</a>
  </div>
</div>

<!-- EDIT/MODAL (for add/edit) -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card">
    <h3 id="modalTitle">Add Employee</h3>
    <input type="text" id="editName" placeholder="Full Name">
    <input type="text" id="editRole" placeholder="Job Role">
    <input type="email" id="editEmail" placeholder="Email">
    <input type="text" id="editDriveId" placeholder="Drive Folder ID (optional)">
    <div class="modal-actions">
      <button class="btn btn-outline" id="cancelModalBtn">Cancel</button>
      <button class="btn btn-primary" id="saveModalBtn">Save</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- DRIVE ROOT FOLDER ----------
    const DRIVE_BASE_URL = "https://drive.google.com/drive/u/0/folders/";
    const ROOT_FOLDER_ID = "18LExKPiPAU4zvAEV5cg8v1ELeC1ncCHU";

    // ---------- EMPLOYEE DATA (initial demo) ----------
    let employees = [
      { id: 1, name: "Alex Johnson", role: "Software Engineer", email: "alex.j@neas.com", driveFolderId: "1A2B3C4D5E" },
      { id: 2, name: "Maria Santos", role: "HR Specialist", email: "maria.s@neas.com", driveFolderId: "2F3G4H5I6J" },
      { id: 3, name: "Kevin Lee", role: "Project Manager", email: "kevin.l@neas.com", driveFolderId: "3K4L5M6N7O" },
      { id: 4, name: "Priya Sharma", role: "UX Designer", email: "priya.s@neas.com", driveFolderId: "4P5Q6R7S8T" },
      { id: 5, name: "David Kim", role: "Data Analyst", email: "david.k@neas.com", driveFolderId: "5U6V7W8X9Y" }
    ];

    // ---------- AUTH STATE ----------
    let currentRole = 'admin'; // default selected
    let currentUser = 'public'; // actual logged in user (default public/viewer)
    let isLoggedIn = false;

    // role credentials
    const credentials = {
      admin: 'admin123',
      hr: 'hr123',
      manager: 'mgr123',
      viewer: '' // viewer needs no password, public
    };

    // ---------- DOM ELEMENTS ----------
    const roleButtons = document.querySelectorAll('.role-btn');
    const passwordInput = document.getElementById('passwordInput');
    const passwordWrapper = document.getElementById('passwordWrapper');
    const loginButton = document.getElementById('loginButton');
    const publicViewerBadge = document.getElementById('publicViewerBadge');
    const currentUserDisplay = document.getElementById('currentUserDisplay');
    const toolbar = document.getElementById('toolbar');
    const addEmployeeBtn = document.getElementById('addEmployeeBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const importCsvInput = document.getElementById('importCsvInput');
    const searchInput = document.getElementById('searchInput');
    const tableBody = document.getElementById('tableBody');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalTitle = document.getElementById('modalTitle');
    const editName = document.getElementById('editName');
    const editRole = document.getElementById('editRole');
    const editEmail = document.getElementById('editEmail');
    const editDriveId = document.getElementById('editDriveId');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const saveModalBtn = document.getElementById('saveModalBtn');

    // helpers
    function getDriveLink(folderId) {
      if (!folderId) return '#';
      return `${DRIVE_BASE_URL}${folderId}`;
    }

    function getInitials(name) {
      return name.split(' ').map(part => part[0]).join('').slice(0,2).toUpperCase();
    }

    // ---------- RENDER TABLE ----------
    function renderTable(filterText = '') {
      const filtered = employees.filter(emp => {
        if (!filterText) return true;
        const search = filterText.toLowerCase();
        return emp.name.toLowerCase().includes(search) || 
               emp.role.toLowerCase().includes(search) || 
               emp.email.toLowerCase().includes(search);
      });

      tableBody.innerHTML = '';
      if (filtered.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:2rem; color:#64748b;">No employees found.</td></tr>`;
        return;
      }

      filtered.forEach(emp => {
        const tr = document.createElement('tr');
        const driveUrl = getDriveLink(emp.driveFolderId || ROOT_FOLDER_ID); // fallback to root folder

        // Employee cell with avatar
        const empCell = document.createElement('td');
        empCell.innerHTML = `<span class="employee-avatar">${getInitials(emp.name)}</span> ${emp.name}`;

        const roleCell = document.createElement('td');
        roleCell.textContent = emp.role;

        const emailCell = document.createElement('td');
        emailCell.textContent = emp.email;

        const driveCell = document.createElement('td');
        driveCell.innerHTML = `<a href="${driveUrl}" target="_blank" class="drive-link"><i class="fab fa-google-drive"></i> Open folder</a>`;

        const actionsCell = document.createElement('td');
        actionsCell.innerHTML = `
          <div class="action-icons">
            ${canEdit() ? `<i class="fas fa-edit" data-id="${emp.id}" title="Edit"></i>
            <i class="fas fa-trash-alt" data-id="${emp.id}" title="Delete"></i>` : 
            `<span class="editable-hint"><i class="fas fa-lock"></i> view only</span>`}
          </div>
        `;

        tr.appendChild(empCell);
        tr.appendChild(roleCell);
        tr.appendChild(emailCell);
        tr.appendChild(driveCell);
        tr.appendChild(actionsCell);
        tableBody.appendChild(tr);
      });

      // attach edit/delete events if allowed
      if (canEdit()) {
        document.querySelectorAll('.fa-edit').forEach(icon => {
          icon.addEventListener('click', (e) => {
            const id = Number(e.target.dataset.id);
            openEditModal(id);
          });
        });
        document.querySelectorAll('.fa-trash-alt').forEach(icon => {
          icon.addEventListener('click', (e) => {
            const id = Number(e.target.dataset.id);
            if (confirm('Delete this employee?')) {
              employees = employees.filter(emp => emp.id !== id);
              renderTable(searchInput.value);
            }
          });
        });
      }
    }

    // Check if current user can edit (admin, hr, manager)
    function canEdit() {
      return isLoggedIn && (currentUser === 'admin' || currentUser === 'hr' || currentUser === 'manager');
    }

    // Update UI based on login state
    function updateAuthUI() {
      if (currentUser === 'viewer' || !isLoggedIn) {
        // viewer public
        currentUserDisplay.innerHTML = `<i class="fas fa-user-circle"></i> <span>public viewer</span>`;
        publicViewerBadge.style.display = 'inline-flex';
        toolbar.style.opacity = '0.6';
        addEmployeeBtn.style.pointerEvents = 'none';
        exportCsvBtn.style.pointerEvents = 'auto'; // viewer can export? yes public viewer can export? allow export for viewer too
        importCsvInput.disabled = true;
        importCsvInput.style.pointerEvents = 'none';
        // disable add/edit through canEdit already
      } else {
        publicViewerBadge.style.display = 'none';
        currentUserDisplay.innerHTML = `<i class="fas fa-user-circle"></i> <span>${currentUser}</span>`;
        toolbar.style.opacity = '1';
        addEmployeeBtn.style.pointerEvents = 'auto';
        importCsvInput.disabled = false;
        importCsvInput.style.pointerEvents = 'auto';
      }
      // re-render table to apply edit/delete visibility
      renderTable(searchInput.value);
    }

    // ---------- LOGIN FUNCTION ----------
    function attemptLogin(selectedRole) {
      const password = passwordInput.value.trim();
      if (selectedRole === 'viewer') {
        // viewer as public, no password required
        isLoggedIn = true;
        currentUser = 'viewer';
        updateAuthUI();
        return;
      }

      const expected = credentials[selectedRole];
      if (password === expected) {
        isLoggedIn = true;
        currentUser = selectedRole;
        updateAuthUI();
      } else {
        alert('Wrong password. Please try again.');
        isLoggedIn = false;
        currentUser = 'public';
        updateAuthUI();
      }
    }

    // initial role selector
    function setActiveRole(role) {
      roleButtons.forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.role === role) btn.classList.add('active');
      });
      currentRole = role;
      if (role === 'viewer') {
        passwordWrapper.style.display = 'none';
        publicViewerBadge.style.display = 'inline-flex';
      } else {
        passwordWrapper.style.display = 'flex';
        publicViewerBadge.style.display = 'none';
      }
    }

    // event listeners role buttons
    roleButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const role = btn.dataset.role;
        setActiveRole(role);
        // auto login viewer click? not yet, requires login button
      });
    });

    loginButton.addEventListener('click', () => {
      const selectedRole = document.querySelector('.role-btn.active').dataset.role;
      attemptLogin(selectedRole);
    });

    // logout if click on public viewer? optional: reset to public with a double click on user badge (simplify)
    currentUserDisplay.addEventListener('dblclick', () => {
      if (confirm('Logout and switch to public viewer?')) {
        isLoggedIn = false;
        currentUser = 'public';
        setActiveRole('viewer');
        passwordInput.value = '';
        updateAuthUI();
      }
    });

    // ---------- MODAL ADD/EDIT ----------
    let editingId = null;

    function openAddModal() {
      editingId = null;
      modalTitle.textContent = 'Add Employee';
      editName.value = '';
      editRole.value = '';
      editEmail.value = '';
      editDriveId.value = '';
      modalBackdrop.classList.add('active');
    }

    function openEditModal(id) {
      const emp = employees.find(e => e.id === id);
      if (!emp) return;
      editingId = id;
      modalTitle.textContent = 'Edit Employee';
      editName.value = emp.name;
      editRole.value = emp.role;
      editEmail.value = emp.email;
      editDriveId.value = emp.driveFolderId || '';
      modalBackdrop.classList.add('active');
    }

    function closeModal() {
      modalBackdrop.classList.remove('active');
    }

    addEmployeeBtn.addEventListener('click', () => {
      if (!canEdit()) {
        alert('Viewer public role cannot add employees.');
        return;
      }
      openAddModal();
    });

    cancelModalBtn.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    saveModalBtn.addEventListener('click', () => {
      if (!canEdit()) {
        alert('No permission to edit.');
        return;
      }
      const name = editName.value.trim();
      const role = editRole.value.trim();
      const email = editEmail.value.trim();
      const driveId = editDriveId.value.trim();

      if (!name || !role || !email) {
        alert('Name, Role, and Email are required.');
        return;
      }

      if (editingId === null) {
        // add new
        const newId = employees.length ? Math.max(...employees.map(e => e.id)) + 1 : 1;
        employees.push({ id: newId, name, role, email, driveFolderId: driveId || ROOT_FOLDER_ID });
      } else {
        // edit
        const emp = employees.find(e => e.id === editingId);
        if (emp) {
          emp.name = name;
          emp.role = role;
          emp.email = email;
          emp.driveFolderId = driveId || ROOT_FOLDER_ID;
        }
      }
      closeModal();
      renderTable(searchInput.value);
    });

    // ---------- CSV EXPORT ----------
    exportCsvBtn.addEventListener('click', () => {
      const headers = ['ID', 'Name', 'Role', 'Email', 'DriveFolderId'];
      const rows = employees.map(emp => [
        emp.id,
        emp.name,
        emp.role,
        emp.email,
        emp.driveFolderId || ROOT_FOLDER_ID
      ]);
      const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'employee_database.csv';
      link.click();
      URL.revokeObjectURL(link.href);
    });

    // ---------- CSV IMPORT ----------
    importCsvInput.addEventListener('change', (e) => {
      if (!canEdit()) {
        alert('Viewer cannot import.');
        importCsvInput.value = '';
        return;
      }
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const text = ev.target.result;
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length < 2) {
          alert('CSV must have header and at least one row.');
          return;
        }
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
        const idIndex = headers.indexOf('id');
        const nameIndex = headers.indexOf('name');
        const roleIndex = headers.indexOf('role');
        const emailIndex = headers.indexOf('email');
        const driveIndex = headers.indexOf('drivefolderid');
        
        if (nameIndex === -1 || roleIndex === -1 || emailIndex === -1) {
          alert('CSV headers must include Name, Role, Email.');
          return;
        }

        const importedEmployees = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim());
          if (cols.length < 4) continue;
          const empId = idIndex !== -1 && cols[idIndex] ? Number(cols[idIndex]) : (employees.length + i);
          const empName = cols[nameIndex];
          const empRole = cols[roleIndex];
          const empEmail = cols[emailIndex];
          const driveFolder = driveIndex !== -1 ? cols[driveIndex] : ROOT_FOLDER_ID;
          if (empName && empRole && empEmail) {
            importedEmployees.push({
              id: empId || (employees.length + i),
              name: empName,
              role: empRole,
              email: empEmail,
              driveFolderId: driveFolder || ROOT_FOLDER_ID
            });
          }
        }
        if (importedEmployees.length) {
          employees = [...employees, ...importedEmployees];
          renderTable(searchInput.value);
          alert(`Imported ${importedEmployees.length} employees.`);
        }
      };
      reader.readAsText(file);
      importCsvInput.value = '';
    });

    // search input listener
    searchInput.addEventListener('input', (e) => {
      renderTable(e.target.value);
    });

    // initialize default role admin, public state
    setActiveRole('admin');
    isLoggedIn = false;
    currentUser = 'public';
    updateAuthUI();
    renderTable('');
  })();
</script>
</body>
</html>
