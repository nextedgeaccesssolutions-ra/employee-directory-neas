<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEAS | Employee Database</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{font-family:Inter,system-ui,sans-serif;color:#1e293b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.page{min-height:100vh;padding:32px 16px;display:grid;place-items:center;background:linear-gradient(135deg,#f5f7fb,#eaf0f8)}.card{width:min(1200px,100%);background:#fff;border-radius:28px;padding:32px;box-shadow:0 22px 50px #0f172a1c}.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px}.mark{width:70px;height:70px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#1e90ff,#0a2647);color:#fff;font-size:24px;font-weight:700}.brand h1{margin:0;font-size:clamp(1.35rem,3vw,1.8rem);color:#0f172a}.brand p{margin:4px 0 0;color:#64748b;font-size:.88rem}.drive{margin-left:auto;display:flex;gap:8px;background:#eef2ff;color:#1e40af;border:1px solid #c7d2fe;padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:600}.auth{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:20px}.roles{display:flex;gap:8px;flex-wrap:wrap}.role,.btn,.login{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer}.role.active,.login,.primary{background:#0f172a;color:#fff;border-color:#0f172a}.pw,.search{border:1px solid #cbd5e1;border-radius:999px;padding:10px 14px;outline:0}.user{margin-left:auto;font-weight:600}.notice{margin:16px 0;padding:12px 16px;border-radius:12px;background:#eff6ff;color:#1d4ed8}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 18px}.search{margin-left:auto;min-width:230px;flex:1;max-width:360px}.table{overflow-x:auto;border:1px solid #e2e8f0;border-radius:18px}table{width:100%;min-width:750px;border-collapse:collapse}th{background:#f8fafc;text-align:left;padding:15px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:#64748b}td{padding:14px 15px;border-top:1px solid #eef2f7;font-size:.9rem}.avatar{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:9px;vertical-align:middle;border-radius:50%;background:#0f172a;color:#fff;font-size:.78rem;font-weight:700}.folder{color:#1e40af;background:#eef2ff;border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:600;text-decoration:none}.actions button{border:0;background:none;cursor:pointer;font-size:1rem;color:#64748b}footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;color:#64748b;font-size:.8rem}footer a{color:#0f172a;text-decoration:none;font-weight:600;background:#f1f5f9;padding:8px 14px;border-radius:999px}.modal-bg{position:fixed;inset:0;background:#0f172a80;display:grid;place-items:center;padding:16px}.modal{width:min(460px,100%);background:#fff;border-radius:22px;padding:26px}.modal h2{margin-top:0}.modal label{display:block;font-size:.85rem;font-weight:600;margin:13px 0;color:#475569}.modal input{width:100%;margin-top:7px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px}.modal-actions{text-align:right;margin-top:20px}.disabled{opacity:.45;pointer-events:none}@media(max-width:700px){.card{padding:20px}.drive,.user{margin-left:0}.pw{width:100%}.search{order:4;max-width:none;flex-basis:100%;margin-left:0}}</style></head><body><main class="page"><section class="card"><header class="brand"><div class="mark">NE</div><div><h1>NextEdge Access Solutions</h1><p>Employee Database · Secure Drive Sync</p></div><div class="drive">📁 Drive Folder</div></header><section class="auth"><div class="roles"><button class="role active" data-role="viewer">👁️ Viewer</button><button class="role" data-role="admin">👑 Admin</button><button class="role" data-role="hr">🧑‍💼 HR</button><button class="role" data-role="manager">📋 Manager</button></div><input class="pw" id="pw" type="password" placeholder="Password" hidden><button class="login" id="login">🔑 Enter as viewer</button><span class="user" id="user">Public viewer</span></section><div class="notice" id="notice" hidden></div><div class="toolbar"><button class="btn primary" id="add" disabled>＋ Add Employee</button><button class="btn" id="export">⇩ Export CSV</button><label class="btn disabled" id="importLabel">⇧ Import CSV<input id="import" type="file" accept=".csv" hidden disabled></label><input class="search" id="search" placeholder="Search employees..."></div><div class="table"><table><thead><tr><th>Employee</th><th>Role</th><th>Email</th><th>Drive Folder</th><th>Actions</th></tr></thead><tbody id="body"></tbody></table></div><footer><span>Employee folders connected to: <strong>18LExKPiPAU4zvAEV5cg8v1ELeC1ncCHU</strong></span><a href="https://vercel.com/nextedgeaccesssolutions-neas/employee-data" target="_blank">Vercel deployment ↗</a></footer></section></main><div id="modal"></div><script>const ROOT='18LExKPiPAU4zvAEV5cg8v1ELeC1ncCHU',BASE='https://drive.google.com/drive/u/0/folders/',creds={admin:'admin123',hr:'hr123',manager:'mgr123'};let employees=JSON.parse(localStorage.getItem('neas-employees')||'null')||[{id:1,name:'Alex Johnson',role:'Software Engineer',email:'alex.j@neas.com',driveFolderId:'1A2B3C4D5E'},{id:2,name:'Maria Santos',role:'HR Specialist',email:'maria.s@neas.com',driveFolderId:'2F3G4H5I6J'},{id:3,name:'Kevin Lee',role:'Project Manager',email:'kevin.l@neas.com',driveFolderId:'3K4L5M6N7O'},{id:4,name:'Priya Sharma',role:'UX Designer',email:'priya.s@neas.com',driveFolderId:'4P5Q6R7S8T'},{id:5,name:'David Kim',role:'Data Analyst',email:'david.k@neas.com',driveFolderId:'5U6V7W8X9Y'}];let role='viewer',editing=null;const $=id=>document.getElementById(id),notice=(x)=>{ $('notice').textContent=x;$('notice').hidden=!x},save=()=>localStorage.setItem('neas-employees',JSON.stringify(employees)),initials=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase(),render=()=>{let q=$('search').value.toLowerCase();$('body').innerHTML=employees.filter(e=>[e.name,e.role,e.email].some(x=>x.toLowerCase().includes(q))).map(e=>`<tr><td><span class="avatar">${initials(e.name)}</span>${e.name}</td><td>${e.role}</td><td>${e.email}</td><td><a class="folder" href="${BASE}${e.driveFolderId||ROOT}" target="_blank">📁 Open folder</a></td><td>${role==='viewer'?'<span>View only</span>':`<div class="actions"><button onclick="openEdit(${e.id})">✎</button><button onclick="del(${e.id})">🗑</button></div>`}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;padding:38px">No employees found.</td></tr>'};function setRole(r){role=r;document.querySelectorAll('.role').forEach(b=>b.classList.toggle('active',b.dataset.role===r));$('pw').hidden=r==='viewer';$('login').textContent=r==='viewer'?'🔑 Enter as viewer':'🔑 Login'}document.querySelectorAll('.role').forEach(b=>b.onclick=()=>setRole(b.dataset.role));$('login').onclick=()=>{if(role==='viewer'){notice('Public viewer access enabled.')}else if($('pw').value===creds[role]){notice('Logged in as '+role+'.');$('pw').value=''}else{setRole('viewer');notice('Incorrect password. Switched to public viewer.')}render()};$('search').oninput=render;$('add').onclick=()=>openEdit();function openEdit(id){if(role==='viewer')return;editing=employees.find(e=>e.id===id)||{name:'',role:'',email:'',driveFolderId:''};$('modal').innerHTML=`<div class="modal-bg"><form class="modal"><h2>${editing.id?'Edit':'Add'} Employee</h2><label>Full name<input name="name" required value="${editing.name}"></label><label>Job role<input name="role" required value="${editing.role}"></label><label>Email<input name="email" type="email" required value="${editing.email}"></label><label>Drive folder ID<input name="driveFolderId" value="${editing.driveFolderId||''}"></label><div class="modal-actions"><button type="button" class="btn" onclick="$('modal').innerHTML=''">Cancel</button> <button class="btn primary">Save employee</button></div></form></div>`;$('modal').querySelector('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),n={id:editing.id||Math.max(0,...employees.map(x=>x.id))+1,name:f.get('name'),role:f.get('role'),email:f.get('email'),driveFolderId:f.get('driveFolderId')||ROOT};employees=editing.id?employees.map(x=>x.id===editing.id?n:x):[...employees,n];save();$('modal').innerHTML='';notice(editing.id?'Employee updated.':'Employee added.');render()}}function del(id){if(confirm('Delete this employee?')){employees=employees.filter(e=>e.id!==id);save();render();notice('Employee deleted.')}}$('export').onclick=()=>{let csv=['ID,Name,Role,Email,DriveFolderId',...employees.map(e=>[e.id,e.name,e.role,e.email,e.driveFolderId].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='employee_database.csv';a.click()};$('import').onchange=e=>{let r=new FileReader;r.onload=()=>{let lines=String(r.result).split(/\r?\n/).filter(Boolean),h=lines.shift().split(',').map(x=>x.trim().toLowerCase()),ix=x=>h.indexOf(x),rows=lines.map((l,i)=>{let c=l.split(',');return{id:Number(c[ix('id')])||Math.max(0,...employees.map(e=>e.id))+i+1,name:c[ix('name')],role:c[ix('role')],email:c[ix('email')],driveFolderId:c[ix('drivefolderid')]||ROOT}}).filter(x=>x.name&&x.role&&x.email);if(rows.length){employees=[...employees,...rows];save();render();notice('Imported '+rows.length+' employees.')}};r.readAsText(e.target.files[0])};render()</script></body></html>
