<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>NEAS | Employee Directory</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f4f7fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      color: #1e293b;
    }
    .app-container {
      width: 100%;
      max-width: 1300px;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }
    .app-header {
      background: #0b1e33;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      border-radius: 50%;
      overflow: hidden;
      background: #0b1e33;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }
    .logo-icon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .logo-text {
      color: white;
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: -0.5px;
    }
    .logo-sub {
      color: #a0c4ff;
      font-size: 0.9rem;
    }
    .drive-badge {
      background: #1a2c40;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      color: #e6edf5;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drive-badge i { color: #2eb82e; }
    .login-bar {
      background: white;
      padding: 0.8rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid #e0e8f0;
    }
    .role-badge {
      background: #eef3fa;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .login-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.6rem 1.3rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid #d9e2ec;
      background: white;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-primary {
      background: #0a2647;
      color: white;
      border-color: #0a2647;
    }
    .btn-primary:hover { background: #1e3a5f; }
    .btn-success {
      background: #1e7e34;
      color: white;
      border-color: #1e7e34;
    }
    .btn-success:hover { background: #145c26; }
    .toolbar {
      padding: 1rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid #e9eef3;
    }
    .search-wrapper {
      display: flex;
      align-items: center;
      background: #f3f6fa;
      border-radius: 40px;
      padding: 0.3rem 0.3rem 0.3rem 1.2rem;
      flex: 1;
      max-width: 420px;
      border: 1px solid #dde3ec;
    }
    .search-wrapper i { color: #6b7a8f; }
    .search-wrapper input {
      border: none;
      background: transparent;
      padding: 0.6rem;
      width: 100%;
      outline: none;
    }
    .table-container {
      overflow-x: auto;
      padding: 0.2rem 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th {
      text-align: left;
      padding: 1rem 1.5rem;
      background: #f9fbfd;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #dde3ec;
    }
    td {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #eef2f7;
    }
    tr:hover td { background: #f8fafd; }
    .avatar {
      background: #cdddec;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin-right: 8px;
      color: #0a2647;
    }
    .folder-link {
      background: #eaf1fd;
      padding: 0.4rem 0.9rem;
      border-radius: 40px;
      text-decoration: none;
      color: #0056b3;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
    }
    .folder-link:hover { background: #d4e3fc; }
    .action-icons { display: flex; gap: 0.5rem; }
    .action-button {
      min-height: 34px;
      padding: 0.35rem 0.6rem;
      border: 1px solid #d7e1ef;
      border-radius: 8px;
      background: #fff;
      color: #1e5d9b;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .action-button:hover { background: #eaf4ff; }
    .action-button.delete { color: #b42318; }
    .editable-hint { font-size: 0.75rem; color: #94a3b8; }
    .footer-note {
      padding: 1rem 2rem;
      background: #fafcff;
      font-size: 0.8rem;
      color: #476788;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      border-top: 1px solid #e2e9f2;
    }
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .modal-backdrop.active {
      visibility: visible;
      opacity: 1;
    }
    .modal-card {
      background: white;
      border-radius: 1.5rem;
      padding: 2rem;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal-card h3 { margin-bottom: 1.2rem; }
    .modal-card input, .modal-card select, .modal-card textarea {
      width: 100%;
      padding: 0.8rem;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      margin-bottom: 1rem;
      font-family: inherit;
    }
    .modal-card textarea {
      resize: vertical;
      min-height: 80px;
    }
    .modal-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
    }
    @media (max-width: 768px) {
      .app-header, .toolbar, .login-bar { padding: 1rem; }
      td, th { padding: 0.8rem 0.6rem; }
      .logo-text { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- HEADER -->
  <div class="app-header">
    <div class="logo-brand">
      <div class="logo-icon"><img src="assets/neas-logo.png" alt="NextEdge Access Solutions logo"></div>
      <div>
        <div class="logo-text">NEAS</div>
        <div class="logo-sub">Employee Directory · Drive Sync</div>
      </div>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="login-bar">
    <div class="role-badge" id="currentRoleDisplay">
      <i class="fas fa-user-shield"></i>
      <span id="roleText">Public viewer (read-only)</span>
    </div>
    <div class="login-actions">
      <button class="btn" onclick="login('admin')">👑 Admin</button>
      <button class="btn" onclick="login('hr')">🧑‍💼 HR</button>
      <button class="btn" onclick="login('manager')">📋 Manager</button>
      <button class="btn" onclick="login('viewer')">👁️ Viewer</button>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search employees..." onkeyup="renderTable(this.value)">
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <button class="btn" onclick="exportCSV()"><i class="fas fa-file-export"></i> Export CSV</button>
       <label id="importLabel" class="btn" for="importFileInput" style="cursor:pointer;"><i class="fas fa-file-import"></i> Import CSV</label>
      <input type="file" id="importFileInput" accept=".csv" style="display:none" onchange="importCSV(event)">
       <button id="addEmployeeBtn" class="btn btn-success" onclick="openAddModal()"><i class="fas fa-user-plus"></i> Add Employee</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Employee</th>
           <th>Role</th>
           <th>Email</th>
           <th>Drive Folder</th>
           <th class="staff-column">Employee No.</th>
           <th class="staff-column">Joined Date</th>
           <th class="staff-column">Address</th>
           <th class="staff-column">Drive Folder</th>
           <th class="staff-column">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="footer-note">
    <span><i class="fas fa-shield-alt"></i> Authorized staff access only</span>
    <span id="employeeCount">0 employees</span>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card">
    <h3 id="modalTitle">Add Employee</h3>
    <input type="text" id="editName" placeholder="Full Name">
    <input type="text" id="editEmployeeNumber" placeholder="Employee Number">
    <select id="editRole" aria-label="Role">
      <option value="">Select role</option>
      <option>Manager</option><option>IRATA LEVEL 1</option><option>IRATA LEVEL 2</option><option>IRATA LEVEL 3</option>
      <option>IRATA LEVEL 3 Manager</option><option>Rope Access Tech.</option><option>Safety Manager</option>
      <option>Safety Consultant</option><option>Safety Officer 2</option><option>Safety Officer 3</option>
      <option>Helper</option><option>Logistic Officer &amp; Helper</option><option>Welder</option><option>NDT</option>
    </select>
    <input type="email" id="editEmail" placeholder="Email">
    <input type="date" id="editJoinDate">
    <textarea id="editAddress" placeholder="Address"></textarea>
    <input type="text" id="editDriveId" placeholder="Drive Folder ID (optional)">
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEmployee()">Save</button>
    </div>
  </div>
</div>

<!-- STAFF SIGN-IN MODAL -->
<div class="modal-backdrop" id="loginBackdrop">
  <div class="modal-card">
    <h3 id="loginTitle">Staff Sign In</h3>
    <p id="loginDescription" style="margin: 0 0 14px; color: #64748b; font-size: .9rem;"></p>
    <input type="password" id="staffPassword" placeholder="Password" autocomplete="current-password">
    <div class="modal-actions">
      <button class="btn" onclick="closeLoginModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitLogin()">Sign In</button>
    </div>
  </div>
</div>

<script>
  const DRIVE_BASE_URL = "https://drive.google.com/drive/u/0/folders/";
  const ROOT_FOLDER_ID = '';
  const ACCESS_EMAIL = 'info.nextedgeaccesssolutions@gmail.com';
  const ACCESS_WHATSAPP = '639159029406';

  let employees = [];

  let currentUser = 'viewer';
  let isLoggedIn = false;
  let editingId = null;
  let pendingRole = null;

  const api = async (url, options = {}) => {
    const response = await fetch(url, { headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
    if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || 'Request failed.');
    return response.status === 204 ? null : response.json();
  };
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' })[char]);

  async function loadEmployees() {
    const data = await api('/api/employees');
    employees = data.employees;
    currentUser = data.staffRole || 'viewer';
    isLoggedIn = currentUser !== 'viewer';
    updateUI();
    const requestedEditId = Number(new URLSearchParams(window.location.search).get('edit'));
    if (canEdit() && Number.isInteger(requestedEditId) && requestedEditId > 0) {
      window.history.replaceState({}, '', window.location.pathname);
      openEditModal(requestedEditId);
    }
  }

  function canEdit() {
    return isLoggedIn && (currentUser === 'admin' || currentUser === 'hr' || currentUser === 'manager');
  }

  function login(role) {
    if (role === 'viewer') {
      api('/api/auth', { method: 'DELETE' }).then(loadEmployees).catch(error => alert(`❌ ${error.message}`));
      return;
    }
    pendingRole = role;
    document.getElementById('loginTitle').textContent = `${role.charAt(0).toUpperCase() + role.slice(1)} Sign In`;
    document.getElementById('loginDescription').textContent = `Enter the ${role} password to manage and publish employee details.`;
    document.getElementById('staffPassword').value = '';
    document.getElementById('loginBackdrop').classList.add('active');
    setTimeout(() => document.getElementById('staffPassword').focus(), 0);
  }

  function closeLoginModal() {
    pendingRole = null;
    document.getElementById('loginBackdrop').classList.remove('active');
  }

  function submitLogin() {
    if (!pendingRole) return;
    const role = pendingRole;
    const password = document.getElementById('staffPassword').value;
    if (!password) { alert('Enter the password to continue.'); return; }
    api('/api/auth', { method: 'POST', body: JSON.stringify({ role, password }) })
      .then(() => { closeLoginModal(); return loadEmployees(); })
      .then(() => alert(`✅ Logged in as ${role}.`))
      .catch(error => alert(`❌ ${error.message}`));
  }

  function updateUI() {
    const display = document.getElementById('roleText');
    if (currentUser === 'viewer' || !isLoggedIn) {
      display.textContent = 'Public viewer (read-only)';
    } else {
      display.textContent = `Logged in as ${currentUser}`;
    }
    document.querySelectorAll('.staff-column').forEach(cell => cell.style.display = canEdit() ? '' : 'none');
    document.getElementById('addEmployeeBtn').style.display = canEdit() ? '' : 'none';
    document.getElementById('importLabel').style.display = canEdit() ? '' : 'none';
    renderTable(document.getElementById('searchInput').value);
  }

  function renderTable(filter = '') {
    const filtered = employees.filter(emp => {
      if (!filter) return true;
      const s = filter.toLowerCase();
      return emp.name.toLowerCase().includes(s) || 
             emp.role.toLowerCase().includes(s) || 
             emp.email.toLowerCase().includes(s) ||
             (emp.address && emp.address.toLowerCase().includes(s)) ||
             (emp.joinedDate && emp.joinedDate.includes(s));
    });

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${canEdit() ? 9 : 4}" style="text-align:center; padding:2rem; color:#64748b;">No employees found.</td></tr>`;
    }

    filtered.forEach(emp => {
      const tr = document.createElement('tr');
      const driveValue = emp.driveFolderId || ROOT_FOLDER_ID;
      const driveUrl = /^https?:\/\//i.test(driveValue) ? driveValue : `${DRIVE_BASE_URL}${driveValue}`;
      const initials = emp.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      
      const requestText = encodeURIComponent(`Hello NextEdge Access Solutions, I would like to request approval to view the Drive folder for ${emp.name}. Please contact me with the access requirements.`);
      const viewerDriveCell = `<td><a href="mailto:${ACCESS_EMAIL}?subject=${encodeURIComponent(`Drive folder access request — ${emp.name}`)}&body=${requestText}" class="folder-link"><i class="fas fa-envelope"></i> Request access</a> <a href="https://wa.me/${ACCESS_WHATSAPP}?text=${requestText}" target="_blank" rel="noopener" class="folder-link"><i class="fab fa-whatsapp"></i> WhatsApp</a></td>`;
      const staffCells = canEdit() ? `
        <td>${escapeHtml(emp.employeeNumber || '—')}</td>
        <td>${escapeHtml(emp.joinedDate || '—')}</td>
        <td title="${escapeHtml(emp.address || '')}">${escapeHtml(emp.address || '—')}</td>
        <td><a href="${driveUrl}" target="_blank" rel="noopener" class="folder-link"><i class="fab fa-google-drive"></i> Open</a></td>
        <td><div class="action-icons"><a class="action-button" href="?edit=${Number(emp.id)}"><i class="fas fa-edit"></i> Edit</a><button type="button" class="action-button delete" data-delete-id="${Number(emp.id)}"><i class="fas fa-trash-alt"></i> Delete</button></div></td>` : '';
      tr.innerHTML = `<td><span class="avatar">${escapeHtml(initials)}</span>${escapeHtml(emp.name)}</td><td>${escapeHtml(emp.role)}</td><td>${escapeHtml(emp.email)}</td>${viewerDriveCell}${staffCells}`;
      tbody.appendChild(tr);
    });

    document.getElementById('employeeCount').textContent = `${filtered.length} employees`;
  }

  function openAddModal() {
    if (!canEdit()) {
      alert('⚠️ Viewer cannot add employees. Please login as Admin, HR, or Manager.');
      return;
    }
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add Employee';
    document.getElementById('editName').value = '';
    document.getElementById('editEmployeeNumber').value = '';
    document.getElementById('editRole').value = '';
    document.getElementById('editEmail').value = '';
    document.getElementById('editJoinDate').value = '';
    document.getElementById('editAddress').value = '';
    document.getElementById('editDriveId').value = '';
    document.getElementById('modalBackdrop').classList.add('active');
  }

  function openEditModal(id) {
    if (!canEdit()) return;
    const emp = employees.find(e => Number(e.id) === Number(id));
    if (!emp) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Edit Employee';
    document.getElementById('editName').value = emp.name;
    document.getElementById('editEmployeeNumber').value = emp.employeeNumber || '';
    setRoleValue(emp.role);
    document.getElementById('editEmail').value = emp.email;
    document.getElementById('editJoinDate').value = emp.joinedDate || '';
    document.getElementById('editAddress').value = emp.address || '';
    document.getElementById('editDriveId').value = emp.driveFolderId || '';
    document.getElementById('modalBackdrop').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('active');
  }

  function setRoleValue(role) {
    const select = document.getElementById('editRole');
    if (![...select.options].some(option => option.value === role)) {
      const option = document.createElement('option');
      option.value = role;
      option.textContent = role;
      select.appendChild(option);
    }
    select.value = role;
  }

  async function saveEmployee() {
    if (!canEdit()) return;
    const name = document.getElementById('editName').value.trim();
    const employeeNumber = document.getElementById('editEmployeeNumber').value.trim();
    const role = document.getElementById('editRole').value.trim();
    const email = document.getElementById('editEmail').value.trim();
    const joinedDate = document.getElementById('editJoinDate').value;
    const address = document.getElementById('editAddress').value.trim();
    const driveId = document.getElementById('editDriveId').value.trim();

    if (!name || !role || !email) {
      alert('Name, Role, and Email are required.');
      return;
    }

    try {
      const employee = { name, employeeNumber, role, email, joinedDate, address, driveFolderId: driveId || ROOT_FOLDER_ID };
      await api('/api/employees', { method: editingId === null ? 'POST' : 'PUT', body: JSON.stringify(editingId === null ? employee : { ...employee, id: editingId }) });
      closeModal();
      await loadEmployees();
      alert('✅ Saved and published live.');
    } catch (error) { alert(`❌ ${error.message}`); }
  }

  async function deleteEmployee(id) {
    if (!canEdit()) return;
    if (confirm('Are you sure you want to delete this employee?')) {
      try {
        await api(`/api/employees?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        await loadEmployees();
        alert('🗑️ Employee deleted and public directory updated.');
      } catch (error) { alert(`❌ ${error.message}`); }
    }
  }

  function exportCSV() {
    const headers = ['ID', 'Name', 'EmployeeNumber', 'Role', 'Email', 'JoinedDate', 'Address', 'DriveFolderId'];
    const rows = employees.map(emp => [
      emp.id, 
      `"${emp.name}"`, 
      `"${emp.employeeNumber || ''}"`,
      `"${emp.role}"`, 
      `"${emp.email}"`,
      emp.joinedDate || '', 
      `"${emp.address || ''}"`,
      emp.driveFolderId || ROOT_FOLDER_ID
    ]);
    
    const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'employee_directory.csv';
    link.click();
    URL.revokeObjectURL(link.href);
    alert('📥 CSV exported successfully!');
  }

  function importCSV(event) {
    if (!canEdit()) {
      alert('⚠️ Viewer cannot import. Please login first.');
      return;
    }
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const lines = ev.target.result.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) {
        alert('CSV must have header and data rows.');
        return;
      }
      
      const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g, ''));
      const nameIdx = headers.indexOf('name');
      const employeeNumberIdx = headers.indexOf('employeenumber');
      const roleIdx = headers.indexOf('role');
      const emailIdx = headers.indexOf('email');
      const dateIdx = headers.indexOf('joineddate');
      const addrIdx = headers.indexOf('address');
      const driveIdx = headers.indexOf('drivefolderid');
      
      if (nameIdx === -1 || roleIdx === -1 || emailIdx === -1) {
        alert('CSV must include Name, Role, Email columns.');
        return;
      }
      
      let importedCount = 0;
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.trim().replace(/"/g, ''));
        if (cols.length < 3) continue;
        if (!cols[nameIdx] || !cols[roleIdx] || !cols[emailIdx]) continue;
        try {
          await api('/api/employees', { method: 'POST', body: JSON.stringify({
            name: cols[nameIdx], role: cols[roleIdx], email: cols[emailIdx],
            employeeNumber: employeeNumberIdx !== -1 ? cols[employeeNumberIdx] : '',
            joinedDate: dateIdx !== -1 ? cols[dateIdx] : '',
            address: addrIdx !== -1 ? cols[addrIdx] : '',
            driveFolderId: driveIdx !== -1 ? cols[driveIdx] : ROOT_FOLDER_ID
          }) });
          importedCount++;
        } catch (error) { alert(`❌ Import stopped: ${error.message}`); break; }
      }
      await loadEmployees();
      alert(`📥 Imported and published ${importedCount} employees successfully!`);
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  // Close modal when clicking backdrop
  document.getElementById('modalBackdrop').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.getElementById('tableBody').addEventListener('click', function(e) {
    const deleteButton = e.target.closest('[data-delete-id]');
    if (deleteButton) deleteEmployee(Number(deleteButton.dataset.deleteId));
  });
  document.getElementById('loginBackdrop').addEventListener('click', function(e) {
    if (e.target === this) closeLoginModal();
  });
  document.getElementById('staffPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitLogin();
  });

  // Initialize from the live public directory; private details are never embedded in the page.
  loadEmployees().catch(error => alert(`❌ Unable to load the live directory: ${error.message}`));
</script>
</body>
</html>
